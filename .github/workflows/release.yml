name: Release

on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release: ${{ steps.check.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check npm and PyPI
        id: check
        run: uv run --no-project python scripts/check_release.py
      - name: Build and test
        if: steps.check.outputs.release == 'true'
        run: |
          uv build
          uv venv /tmp/lucide-test
          uv pip install --python /tmp/lucide-test/bin/python dist/*.whl
          /tmp/lucide-test/bin/python -m unittest discover -s tests
          uv run --no-project python scripts/check_dist.py
      - name: Commit version and tag
        if: steps.check.outputs.release == 'true'
        env:
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pyproject.toml
          if ! git diff --cached --quiet; then
            git commit -m "Release $VERSION"
          fi
          if git rev-parse "refs/tags/v$VERSION" >/dev/null 2>&1; then
            test "$(git rev-list -n 1 "v$VERSION")" = "$(git rev-parse HEAD)"
          else
            git tag "v$VERSION"
          fi
          git push --atomic origin "HEAD:${{ github.event.repository.default_branch }}" "refs/tags/v$VERSION"
      - uses: actions/upload-artifact@v4
        if: steps.check.outputs.release == 'true'
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    if: needs.build.outputs.release == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: astral-sh/setup-uv@v7
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - run: uv publish --trusted-publishing always --check-url https://pypi.org/simple/
