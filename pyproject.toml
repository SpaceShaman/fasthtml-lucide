[project]
name = "fasthtml-lucide"
version = "1.61.0"
description = "Lucide SVG icons for FastHTML."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "SpaceShaman", email = "spaceshaman@tuta.io" }]
keywords = ["components", "fasthtml", "icons", "lucide", "svg", "ui", "web"]
classifiers = [
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = ["python-fasthtml>=0.14.13"]

[project.urls]
Documentation = "https://github.com/SpaceShaman/fasthtml-lucide#readme"
Homepage = "https://github.com/SpaceShaman/fasthtml-lucide"
Issues = "https://github.com/SpaceShaman/fasthtml-lucide/issues"
Repository = "https://github.com/SpaceShaman/fasthtml-lucide"

[dependency-groups]
test = ["pytest"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fasthtml_lucide"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/hatch_build.py", "/pyproject.toml", "/README.md", "/LICENSE", "/tests"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"
